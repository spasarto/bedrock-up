[package]
name = "bedrock-supervisor"
version.workspace = true
edition.workspace = true

[lib]
name = "bedrock_supervisor"
path = "src/lib.rs"

[[bin]]
name = "bedrock-supervisor"
path = "src/main.rs"

[[bin]]
name = "fake-bedrock-server"
path = "src/bin/fake-bedrock-server.rs"

[dependencies]
bedrock-up = { path = "../bedrock-up", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
shellexpand = "3.1.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
